name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  seed-tests:
    name: Seed interpreter (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run seed integration tests
        run: cargo test

  docker-tests:
    name: Docker runtime (avencc inside container)
    runs-on: ubuntu-latest
    needs: seed-tests
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Vendor dependencies (offline Docker build)
        run: cargo vendor

      - name: Build Docker image
        run: docker build -t aven .

      - name: Run driver-fixture tests inside container
        run: |
          docker run --rm \
            --entrypoint bash \
            aven /app/bin/test-docker
